<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6f42c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63384;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente para el ícono -->
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e7f3ff;stop-opacity:1" />
    </linearGradient>

    <!-- Patrón de puntos decorativos -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Fondo principal -->
  <rect width="1200" height="300" fill="url(#bgGradient)" />
  <rect width="1200" height="300" fill="url(#dots)" />

  <!-- Círculos decorativos -->
  <circle cx="1050" cy="80" r="180" fill="#ffffff" opacity="0.06" />
  <circle cx="150" cy="250" r="120" fill="#ffffff" opacity="0.05" />

  <!-- Ícono de caja (logo) -->
  <g transform="translate(80, 75)">
    <!-- Sombra del ícono -->
    <ellipse cx="70" cy="155" rx="55" ry="8" fill="#000000" opacity="0.15" />

    <!-- Caja principal -->
    <rect x="15" y="40" width="110" height="105" rx="12" fill="url(#boxGradient)" />

    <!-- Tapa de la caja -->
    <rect x="15" y="30" width="110" height="30" rx="8" fill="#ffc107" />

    <!-- Cinta vertical -->
    <rect x="60" y="30" width="20" height="115" fill="#ffc107" opacity="0.9" />
    <rect x="60" y="30" width="20" height="20" fill="#e0a800" />

    <!-- Brillo de la caja -->
    <rect x="20" y="45" width="15" height="90" rx="4" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Título principal -->
  <text x="280" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Sistema de Inventario
  </text>

  <!-- Subtítulo -->
  <text x="285" y="185" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="22" font-weight="400" fill="#ffffff" opacity="0.9">
    Gestión inteligente de productos, ventas y stock
  </text>

  <!-- Badges decorativos -->
  <g transform="translate(285, 210)">
    <!-- Badge PHP -->
    <rect x="0" y="0" width="75" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="37" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" 
          fill="#ffffff" text-anchor="middle">PHP 8+</text>

    <!-- Badge MySQL -->
    <rect x="85" y="0" width="90" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="130" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" 
          fill="#ffffff" text-anchor="middle">MySQL</text>

    <!-- Badge Bootstrap -->
    <rect x="185" y="0" width="105" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="237" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" 
          fill="#ffffff" text-anchor="middle">Bootstrap 5</text>
  </g>
</svg>